services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careflow}
      POSTGRES_USER: ${POSTGRES_USER:-careflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-careflow} -d ${POSTGRES_DB:-careflow}
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://careflow:careflow@db:5432/careflow}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      DATA_MODE: synthetic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:

